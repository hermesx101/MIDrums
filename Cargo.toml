[workspace]
resolver = "2"
members = ["crates/drums-core", "crates/drums-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["DRUMS contributors"]
description = "MI Drums — an open-source MIDI drum practice application."

[workspace.dependencies]
midir = "0.10"
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
midly = "0.5"
rfd = "0.15"
rodio = "0.20"
drums-core = { path = "crates/drums-core" }
